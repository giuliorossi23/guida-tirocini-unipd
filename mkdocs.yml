site_name: Guida Tirocini UniPD
site_description: Guida chiara e operativa per i tirocini degli studenti di Padova

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passa alla modalità scura
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passa alla modalità chiara
  features:
    - navigation.tabs
    - navigation.instant
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list

nav:
  - "1. Introduzione e Ricerca": index.md
  - "2. Attivazione (Sicurezza e Burocrazia)": attivazione.md
  - "3. Durante e Fine Tirocinio": svolgimento.md
  - "4. Contatti e Link Utili": contatti.md

extra_css:
  - stylesheets/extra.css